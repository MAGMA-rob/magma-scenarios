tools:
  launch_cycle:
    name:
      - start_assembly_cycle
      - execute_assembly_cycle
      - run_assembly_cycle
      - launch_assembly_sequence
      - initiate_assembly_cycle

    description:
      - Launch an assembly cycle under a specific manufacturing order. The cycle produces a fixed number of assemblies and assembles two parts.
      - Execute an assembly sequence associated with a production order.
      - Initiate a manufacturing run where two parts are assembled according to a manufacturing order.
      - Start an automated assembly routine for two components, tied to a production or batch order.
      - Run a default cycle that joins two items under a defined job reference.

    parameters:

      manufacturing_order:
        name:
          - manufacturing_order
          - production_order
          - job_reference
          - order_id
          - batch_order
        description:
          - The manufacturing order associated with the cycle.
          - Identifier of the production or batch order linked to this assembly cycle.
          - The job or manufacturing reference corresponding to this process.
          - Order code used to associate this cycle with a production batch.
          - The ID of the active manufacturing order for this cycle.

      nb_assembly:
        name:
          - nb_assembly
          - number_of_assemblies
          - assembly_count
          - repetition_number
          - quantity
        description:
          - The number of assemblies to make.
          - Number of assemblies to produce before stopping.
          - Total count of assemblies in the cycle.
          - Specifies how many assemblies should be executed.
          - Quantity of assemblies planned in this run.

      first_part:
        name:
          - first_part
          - object1
          - part1
          - component_a
          - primary_piece
        description:
          - The first part to assemble.
          - Name of the first component entering the assembly.
          - The primary piece to be joined with the second part.
          - Identifier of the first object involved in the assembly process.
          - The initial element used in the assembly operation.

      second_part:
        name:
          - second_part
          - object2
          - part2
          - component_b
          - secondary_piece
        description:
          - The second part to assemble.
          - Name of the second

attributes:
  parts:
    - ["part_A", "part_B", "part_C", "part_D", "part_E", "part_F"]
    - ["part_1", "part_2", "part_3", "part_4", "part_5", "part_6"]
    - ["component_A", "component_B", "component_C", "component_D", "component_E", "component_F"]
    - ["object_1", "object_2", "object_3", "object_4", "object_5", "object_6"]
    - ["P001", "P002", "P003", "P004", "P005", "P006"]
    - ["A1", "A2", "A3", "A4", "A5", "A6"]
    - ["base_plate", "mount_bracket", "support_frame", "joint_module", "cover_panel", "end_cap"]
    - ["gear", "shaft", "bearing", "housing", "coupling", "separator"]
    - ["piece_A", "piece_B", "piece_C", "piece_D", "piece_E", "piece_F"]
    - ["left_piece", "right_piece", "upper_part", "lower_part", "front_panel", "rear_panel"]