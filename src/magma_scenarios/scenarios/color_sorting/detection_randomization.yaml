tools:
  take:
    name:
      - take
      - pick_object_by_name
      - grab_item_by_id

    description:
      - Take an object by its name.
      - Pick an item using its identifier.
      - Grab the referenced item using its given name.

    parameters:
      name:
        name:
          - name
          - object_name
          - item_id
          - target
          - object_label

        description:
          - The name of the object to take.
          - Identifier of the item to pick.
          - Label associated with the object to retrieve.
          - The target object's name used for selection.
          - The ID used to locate the object to be taken.
      obj_color:
        name:
          - obj_color
          - cube_color
          - color
          - requested_color
        description:
          - The color of the cube to take.
          - Color identifying the cube that must be picked.
          - Requested cube color for the grasp action.
          - Color of the target cube.
      source:
        name:
          - source
          - location
          - source_location
          - pickup_area
        description:
          - The location containing the cube.
          - Table or tray from which the cube must be taken.
          - Source location containing the requested cube.
          - Area where the robot should look for the cube.

  put:
    name:
      - put
      - place_held_cube
      - drop_at_location
      - send_to_target

    description:
      - Put the held cube on the table or in a color tray.
      - Place the held cube on the table or in the specified tray.
      - Drop the held cube on the table or into a color tray.
      - Send the held cube to the table or a named tray.
      - Move the held cube onto the table or into a tray.

    parameters:
      target:
        name:
          - target
          - destination
          - target_location
          - placement_target
          - destination_area

        description:
          - Use table or a tray name such as white_tray.
          - "Destination: table or the name of a color tray."
          - Set to table to return the cube to the table, or name a tray.
          - The destination, either table or a tray such as white_tray.
          - Choose table or the named tray that should receive the cube.

  get_object_state:
    name:
      - get_objects_state
      - detect_object
      - list_detected_objects
      - read_object_positions
      - query_objects_info

    description:
      - Return the description and position of all detected objects on the table.
      - Retrieve the list, properties, and positions of all visible objects.
      - Provide the current state of every detected object.

    parameters: {}
