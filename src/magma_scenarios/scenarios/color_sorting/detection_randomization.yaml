tools:
  take:
    name:
      - take
      - pick_object_by_name
      - grab_item_by_id

    description:
      - Take an object by its name.
      - Pick an item using its identifier.
      - Grab the referenced item using its given name.

    parameters:
      name:
        name:
          - name
          - object_name
          - item_id
          - target
          - object_label

        description:
          - The name of the object to take.
          - Identifier of the item to pick.
          - Label associated with the object to retrieve.
          - The target object's name used for selection.
          - The ID used to locate the object to be taken.
      obj_color:
        name:
          - obj_color
          - cube_color
          - color
          - requested_color
        description:
          - The color of the cube to take.
          - Color identifying the cube that must be picked.
          - Requested cube color for the grasp action.
          - Color of the target cube.
      source:
        name:
          - source
          - location
          - source_location
          - pickup_area
        description:
          - The location containing the cube.
          - Table or tray from which the cube must be taken.
          - Source location containing the requested cube.
          - Area where the robot should look for the cube.

  put:
    name:
      - put
      - place_to_box
      - drop_in_colored_box
      - send_to_box

    description:
      - Put the held object in a box corresponding to the given color.
      - Drop the currently held item into the box with the specified color.
      - Store the object in the container labeled with the given color.
      - Send the held object to its designated color box.
      - Allocate the item into the matching color compartment.

    parameters:
      target:
        name:
          - target
          - tray_name
          - target_tray
          - destination
          - destination_tray

        description:
          - The name of the target tray.
          - The tray that should receive the held cube.
          - The destination tray where the cube must be placed.
          - Name of the container selected for the held object.
          - The colored tray corresponding to the cube's destination.

  get_object_state:
    name:
      - get_objects_state
      - detect_object
      - list_detected_objects
      - read_object_positions
      - query_objects_info

    description:
      - Return the description and position of all detected objects on the table.
      - Retrieve the list, properties, and positions of all visible objects.
      - Provide the current state of every detected object.

    parameters: {}
