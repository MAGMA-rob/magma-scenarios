tools:
  take:
    name:
      - take_object
      - pick
      - pick_object
      - grab_product
      - collect_item
    description:
      - Take a product by its name.
      - Pick up the specified product by name.
      - Grab a product identified by its name.
      - Collect a product using the gripper.

    parameters:
      name:
        name:
          - name
          - product_name
          - item_name
          - target_product
        description:
          - Name of the object to take.
          - The name of the product the robot should grab.
          - Identifier of the product to collect.
          - Name of the target item to pick up.

  drop_to:
    name:
      - drop_to
      - place_in
      - put_in_container
      - deposit_into
      - release_to
    description:
      - Drop the held object into a specific container.
      - Place the currently held product into the target container.
      - Deposit the held item into the specified container.
      - Put the object being held into the given container.
      - Release the held item inside the destination container.

    parameters:
      container_id:
        name:
          - container_id
          - target_container
          - box_id
          - destination_id
        description:
          - The id of the target container where the object should be placed.
          - Identifier of the container in which to drop the item.
          - ID of the destination container for depositing the held product.
          - Numeric ID of the container to place the held object into.

  get_unsorted_object:
    name:
      - list_remaining_objects
      - fetch_unclassified_items
      - query_table_objects
      - retrieve_loose_items
      - scan_unsorted_objects
    description:
      - Return the list of remaining object names on the table.
      - Get all unclassified or unsorted objects still present on the table.
      - Retrieve the names of objects that have not yet been sorted.
      - Provide a list of loose items currently detected on the table surface.
      - Return all items that remain unorganized on the workspace.

    parameters: {}

  get_sorted_object_from_containers:
    name:
      - list_container_contents
      - fetch_sorted_items
      - query_container_objects
      - retrieve_container_inventory
      - get_container_object_map
    description:
      - Return, for each container, the name of the objects inside it.
      - Provide a mapping of containers to the objects they contain.
      - Retrieve the list of items sorted into each container.
      - Return a dictionary of all containers and their stored objects.
      - Get the current inventory of every container, showing which objects are inside.

    parameters: {}

attributes:
  instance_detected:
    - ["productA_1","productA_2","productA_3", "productB_1", "productB_2"]
    - ["productA-1","productA-2","productA-3", "productB-1", "productB-2"]
  product_type:
    - ["productA", "productB"]
    - ["A", "B"]