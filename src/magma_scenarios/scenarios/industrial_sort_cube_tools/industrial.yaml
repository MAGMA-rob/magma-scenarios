tools:
  launch_cycle:
    name:
      - execute_sorting_cycle
      - run_extraction_sequence
      - process_reference_cycle
      - initiate_sorting_operation
      - start_transfer_cycle
    description:
      - Launch a cycle for one reference only to extract it from the bin and send it to a target container.
      - Start a sorting cycle for a single reference to move it from the bin to its destination container.
      - Execute a reference-handling cycle to extract and deliver items to the target container.
      - Initiate a material transfer cycle for the given reference.
      - Run a cycle dedicated to sorting and transferring one reference from storage to output.

    parameters:
      reference:
        name:
          - reference
          - ref_name
          - item_reference
          - ref_code
          - target_ref
        description:
          - The reference to sort.
          - Identifier of the reference item to process during the cycle.
          - The name or code of the reference to extract.
          - The unique reference representing the product to be sorted.
          - Reference tag to use for the current extraction operation.

      manufacturing_order:
        name:
          - manufacturing_order
          - production_order
        description:
          - The Manufacturing Order associated with this cycle.
          - The job reference tied to the current manufacturing cycle.
          - Identifier of the manufacturing task related to this sorting step.

      target_container:
        name:
          - target_container
          - destination_box
          - output_bin
          - delivery_container
          - receiving_slot
        description:
          - The target container to send objects inside.
          - Destination container where the extracted objects should be placed.
          - The bin or box designated to receive the sorted reference.
          - Container assigned for the delivery of the processed items.
          - The receiving storage unit for this sorting cycle.

  add_new_ref:
    name:
      - register_reference
      - append_new_ref
      - create_reference_entry
      - insert_ref_code
      - define_new_ref
    description:
      - Add a new ref to your attributes. The ref must be of exactly four characters.
      - Register a new reference code composed of four characters.
      - Add a 4-character ref entry into the system attributes.
      - Define a new reference identifier with exactly four letters.
      - Create a new reference tag in your attribute list (must be 4 characters).

    parameters:
      ref_name:
        name:
          - ref_name
          - reference_code
          - ref_id
          - ref_tag
          - new_ref
        description:
          - The name of the ref to add. It must be composed of 4 characters only.
          - The 4-character code representing the new reference.
          - Reference name to register in the system (exactly four letters).
          - Unique identifier for the new ref (length = 4).
          - Name of the new reference key to add, must be 4 characters long.

attributes:
  known_reference:
    - ["2350", "2450"]
    - ["A580", "A570"]
    - ["RTY0", "RTX0"]
    - ["g001", "g100"]
    - ["80RT", "20TY"]
    - ["A010", "A020"]
  known_target:
    - ["containerA","containerB"]
    - ["container1","container2"]
    - ["box1","box2"]
    - ["container_1","container_2"]