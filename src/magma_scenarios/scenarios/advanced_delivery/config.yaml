tools:
  move_to:
    name: [move_to, navigate_to, go_to_destination]
    description:
      - Move to a listed destination, carrying the held tray or package and its contents. A product held only in the gripper is not carried.
      - Navigate to a listed spot or bay with the held tray or package and its contents. A gripped product does not travel.
      - Send the robot to a listed location with its held tray or package and contents. Products only in the gripper stay behind.
    parameters:
      target:
        name: [target, destination, station]
        description: [One of the listed move_targets., Destination from the listed move_targets., Listed spot or bay to reach.]
  take_package:
    name: [take_package, collect_package_tray, pick_output_package]
    description:
      - At a matching output bay, take an available package tray.
      - At a matching output bay, collect a free package tray.
      - At a matching output bay, pick up an available shipping tray.
  drop_package:
    name: [drop_package, release_package_tray, return_package_to_output]
    description: [Put the held package tray on the output table., Release the carried package tray at the output station., Return the held shipping tray to the output table.]
  pick:
    name: [pick, take_product, collect_item]
    description: [Take a product., Pick up the requested product., Collect a specified product with the gripper.]
    parameters:
      name:
        name: [name, product_name, item]
        description: [Name of the product to take., Identifier of the product to pick up., Product that the robot must collect.]
  put:
    name: [put, place_product, deposit_item]
    description:
      - "Put the held product on table, tray, package, or trashcan; spot and bay names are not targets."
      - "Place the carried product using table, tray, package, or trashcan; never use a spot or bay name."
      - "Deposit the held item on table, tray, package, or trashcan; spot and bay names are not targets."
    parameters:
      target:
        name: [target, destination, placement]
        description: ["Exactly table, tray, package, or trashcan.", "Use table, tray, package, or trashcan; never a spot or bay name.", "One of table, tray, package, or trashcan."]
  inspect:
    name: [inspect, examine_product, check_held_item]
    description: [Inspect the held product to learn whether it is clean or broken., Examine the held product for a clean or broken result., Check whether the carried product is clean or broken.]
  detection:
    name: [detection, scan_products, list_nearby_items]
    description: [List products on the current table and in the held tray or package., Scan the current table and held tray or package for products., Report products on the current table and in the held tray or package.]
  attach_shipping_label:
    name: [attach_shipping_label, label_package, apply_delivery_label]
    description: ["At an output bay, label a dropped nonempty package with its order ID, recipient name, and city.", "At the output bay, label the dropped package with the exact order ID, recipient name, and city.", "Apply the exact order ID, recipient name, and city to a dropped nonempty package at an output bay."]
    parameters:
      name:
        name: [name, recipient, customer_name]
        description: [Recipient name to write on the label., Name of the package recipient., Customer name for the shipping label.]
      city:
        name: [city, destination_city, delivery_city]
        description: [Destination city to write on the label., City where the package must be shipped., Delivery city for the shipping label.]
