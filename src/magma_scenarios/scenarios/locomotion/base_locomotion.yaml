tools:
  wave_hand:
    name:
      - wave_right_hand
      - wave_the_hand
      - greet_motion
      - perform_wave
      - hand_gesture_hello
    description:
      - Move the hand of the robot to say hello during a specific duration.
      - Perform a waving gesture to greet someone.
      - Make the robot wave its hand as a greeting for a set time.
      - Execute a friendly hand wave for the given duration.
      - Animate the robot’s arm to perform a hello gesture.

    parameters:
      duration:
        name:
          - duration
          - time
          - motion_time
          - wave_duration
          - gesture_length
        description:
          - The duration of the movement.
          - Time in seconds for the waving gesture.
          - Duration of the greeting motion.
          - How long the hand should wave.
          - The total time the gesture should last.

  walk:
    name:
      - walk_forward
      - move_toward_person
      - step_ahead
      - advance_to_target
      - approach_user
    description:
      - Make the robot walk towards him for a specific duration.
      - Move the robot forward in the direction of the user for the given duration.
      - Command the robot to step ahead for a set period of time.
      - Have the robot approach the person for a specific time span.
      - Instruct the robot to walk forward toward the user.

    parameters:
      duration:
        name:
          - duration
          - walk_time
          - forward_duration
          - motion_time
          - step_length_time
        description:
          - The duration of the movement.
          - Time span during which the robot walks forward.
          - Duration of forward walking motion.
          - Time in seconds to continue walking before stopping.
          - Length of time the robot should move toward the target.

  do_squat:
    name:
      - perform_squat
      - squat_exercise
      - do_a_squat
      - execute_squat_sequence
    description:
      - Make a squat.
      - Perform a series of squatting movements.
      - Command the robot to do squats as an exercise.
      - Execute the squat action a specified number of times.
      - Make the robot bend its legs to simulate squats.

    parameters:
      nb:
        name:
          - nb
          - count
          - repetitions
          - squat_number
          - times
        description:
          - The number of squats to do.
          - Number of squat repetitions to perform.
          - Total count of squats the robot should execute.
          - How many times the robot should squat.
          - Quantity of squat actions to complete.

attributes: {}