tools:
  take_obj:
    name:
      - grab_object
      - pick_target
      - acquire_item
      - take_object_from_env
      - fetch_entity
    description:
      - Take an object from the environment.
      - Pick up a specific object and hold it with the gripper.
      - Retrieve the desired item from its current position.
      - Acquire a target object and secure it for transfer.
      - Grasp the chosen entity from the workspace.

    parameters:
      obj:
        name:
          - obj
          - name_obj
          - object_name
          - target_obj
          - picked_item
          - object_ref
        description:
          - The name of the object to take with the gripper.
          - Identifier of the object that should be picked.
          - The reference of the item to acquire from the workspace.
          - Name of the target entity the robot must grab.
          - The label of the object to lift or grasp.

  add_new_location:
    name:
      - add_new_location
      - create_location
      - define_location
      - register_location
      - add_storage_area
      - declare_new_place
    description:
      - Add a new location to the set of known areas the robot can use.
      - Create a new storage location that the robot can reference later.
      - Register a new area where objects may be placed or stored.
      - Define a new location in the robot's internal map.
      - Introduce a new usable location for object storage.

    parameters:
      location_name:
        name:
          - location_name
          - new_location
          - area_name
          - place_name
          - storage_location
          - location_id
        description:
          - The name of the new location to add.
          - Identifier of the location to be created.
          - Name of the area that should be registered.
          - Label of the new place the robot can use.
          - The unique name of the storage location to define.


  remove_location:
    name:
      - remove_location
      - delete_location
      - unregister_location
      - discard_location
      - remove_storage_area
      - clear_location
    description:
      - Remove an existing location from the known areas.
      - Delete a previously defined storage location.
      - Unregister a location so it can no longer be used.
      - Remove an area from the robot's internal map.
      - Discard a known location from the environment model.

    parameters:
      location_name:
        name:
          - location_name
          - target_location
          - area_name
          - place_name
          - storage_location
          - location_id
        description:
          - The name of the location to remove.
          - Identifier of the location that should be deleted.
          - Name of the area to unregister.
          - Label of the place that must be removed.
          - The existing storage location to discard.


  depose:
    name:
      - place_object_in_area
      - deposit_item
      - move_to_target_area
      - drop_object_in_zone
      - release_item_to_area
      - move_to_location
    description:
      - Put the held object in a specified area.
      - Move the robot gripper above the target area and release the object.
      - Deposit the currently held item into the designated location.
      - Transfer the gripped object to its intended zone and let go.
      - Position the object over its assigned area and drop it safely.

    parameters:
      target:
        name:
          - area_name
          - target_area
          - drop_zone
          - location
          - destination_area
          - placement_zone
        description:
          - The name of the area where the object should be placed.
          - Target area to move the object above and release it.
          - The drop zone corresponding to the object’s intended destination.
          - Area identifier where the robot must deposit the current item.
          - Destination zone for the final placement of the held object.

