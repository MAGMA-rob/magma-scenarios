tools:
  get_object_in_package:
    name: [get_object_in_package, inspect_package, list_package_contents]
    description: [List the products in the package held by the robot., Inspect the held package and report its contents., List all products currently stored in the carried package.]
  take:
    name: [take, take_product, pick_product_type]
    description: [Take an available product of a given type., Pick up an available item matching the requested product type., Collect one available product of the specified type.]
    parameters:
      type_obj:
        name: [type_obj, product_type, item_type]
        description: [Type of product to take., Requested product category., Type of item the robot must collect.]
  put:
    name: [put, place_product, deposit_item]
    description: [Put the held product on a free table cell or inside the held package., Place the carried product on the table or in the current package., Deposit the held item at the requested table or package target.]
    parameters:
      target:
        name: [target, destination, placement]
        description: [Target table or package location., Destination for the held product., Placement target that should receive the item.]
  move_to:
    name: [move_to, navigate_to, go_to_station]
    description: [Move the robot to a product or package station., Navigate the robot to the requested station., Send the robot to a product or package location.]
    parameters:
      target:
        name: [target, destination, station]
        description: [Station the robot must reach., Destination product or package location., Target station for robot navigation.]
  mark_package:
    name: [mark_package, assign_order, label_package]
    description: [Assign a manufacturing order to a package., Mark a package with its manufacturing order., Associate the specified package with an order reference.]
    parameters:
      package:
        name: [package, package_name, box]
        description: [Package to mark., Name of the package receiving the order., Box to associate with the manufacturing order.]
      manufacturing_order:
        name: [manufacturing_order, order_reference, order]
        description: [Manufacturing order assigned to the package., Order reference to write on the package., Manufacturing order associated with the box.]
  take_box:
    name: [take_box, collect_package, pick_storage_box]
    description: [Take an available package from storage., Collect the requested package from storage., Pick up an available storage box.]
    parameters:
      package:
        name: [package, package_name, box]
        description: [Package to take from storage., Name of the package to collect., Storage box the robot must pick up.]
  drop_box:
    name: [drop_box, release_package, put_down_box]
    description: [Drop the package currently held by the robot., Release the carried package at the current station., Put down the box held by the robot.]

