tools:
  take_object:
    name:  # name variations
      - take_object
      - grab_item
      - pick_up
      - collect_object
    description:  # description variations
      - Take an object by its name.
      - Pick up a specific object identified by its name.
      - Grab the object and move it into the gripper.
      - Collect the item using the robot’s gripper.

    parameters:
      obj_name:
        name:  # parameter name variations
          - obj_name
          - item_name
          - object_id
          - target_name
        description:  # parameter description variations
          - Name of the object to take. It will automatically move the gripper to the object and take it.
          - Identifier of the object to pick up with the gripper.
          - The specific item the robot should grab.
          - Name of the target object for the robot to collect.

  drop_object_to_location:
    name:
      - drop_object
      - place_item
      - put_down
      - release_object
      - deposit_item
    description:
      - Drop the object held at a specified location. You must have take an object in your gripper before using this function. If the location is a cube, it will stack the held cube on top of the location cube.
      - Place the held object at a target location. Requires that the robot is already holding an object.
      - Release the item at the designated spot. If it is a cube, it will stack on top of the existing cube.
      - Put down the object you are holding at a specified location. If it is a cube, it will stack the held cube on top of the location cube.
      - Deposit the object onto the target location. Cubes will be stacked if applicable.

    parameters:
      location:
        name:
          - location
          - target_location
          - drop_site
          - place_position
        description:
          - Location to drop the held object. Must be the name of the target object.
          - Name of the place where the object should be released.
          - Target site for putting down the object.
          - Position where the robot should deposit the held item.

attributes: 
  object_name:
    - ["red_cube","blue_cube","green_cube","white_box"]
    - ["cube_red","cube_blue","cube_green","box"]
